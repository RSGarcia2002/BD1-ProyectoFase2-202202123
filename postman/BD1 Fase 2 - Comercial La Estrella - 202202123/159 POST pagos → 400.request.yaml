$kind: http-request
url: "{{baseUrl}}/api/pagos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_pag": {{id_29}},
      "monto_pag": 1,
      "id_met_pag": 1,
      "id_ven": {{id_24}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Mensaje esperado', () => pm.expect(pm.response.json().error).to.eql("No se pueden modificar pagos de ventas ANULADAS"));
    language: text/javascript
order: 159000
