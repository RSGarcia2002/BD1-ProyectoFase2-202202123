$kind: http-request
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_pro": {{id_15}},
      "nombre_pro": "Prueba {{id_15}}",
      "descripcion_pro": "Agua pura presentacion original, categoria Bebidas",
      "id_cat": 1,
      "id_mar": 4
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Llaves devueltas', () => { const b=JSON.parse(pm.variables.replaceIn(pm.request.body.raw)); const r=pm.response.json(); Object.keys(b).filter(k=>k.startsWith('id_')).forEach(k=>pm.expect(r[k]).to.eql(b[k])); });
    language: text/javascript
order: 88000
