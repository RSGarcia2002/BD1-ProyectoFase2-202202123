$kind: http-request
url: "{{baseUrl}}/api/estados-venta"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_es_ven": {{id_9}},
      "nombre_es_ven": "REGISTRADA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 409', () => pm.response.to.have.status(409));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Mensaje esperado', () => pm.expect(pm.response.json().error).to.eql("Ya existe un registro con esa llave o valor unico"));
    language: text/javascript
order: 50000
