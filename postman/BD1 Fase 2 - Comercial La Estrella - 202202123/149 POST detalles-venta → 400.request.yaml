$kind: http-request
url: "{{baseUrl}}/api/detalles-venta"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_ven": {{id_26}},
      "id_pro": {{id_23}},
      "cantidad_des_ven": 5,
      "precio_unitario_des_ven": 10
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Mensaje esperado', () => pm.expect(pm.response.json().error).to.eql("Stock insuficiente"));
    language: text/javascript
order: 149000
