$kind: http-request
name: 007 GET paises/{{id_1}} → 404
url: "{{baseUrl}}/api/paises/{{id_1}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 404', () => pm.response.to.have.status(404));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Mensaje esperado', () => pm.expect(pm.response.json().error).to.eql("Registro no encontrado"));
    language: text/javascript
order: 7000
