$kind: http-request
url: "{{baseUrl}}/api/tiendas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_ti": {{id_12}},
      "nombre_ti": "Prueba {{id_12}}",
      "direccion_ti": "18 Avenida 7-38 zona 15",
      "telefono_ti": "24335942",
      "id_mun": 41,
      "id_tip_tie": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Llaves devueltas', () => { const b=JSON.parse(pm.variables.replaceIn(pm.request.body.raw)); const r=pm.response.json(); Object.keys(b).filter(k=>k.startsWith('id_')).forEach(k=>pm.expect(r[k]).to.eql(b[k])); });
    language: text/javascript
order: 66000
