$kind: http-request
url: "{{baseUrl}}/api/paises"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "id_pa": {{id_30}},
      "nombre_pa": "X",
      "inyeccion": "DROP TABLE venta"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', () => pm.response.to.have.status(400));
      pm.test('Respuesta JSON', () => pm.response.to.be.json);
      pm.test('Mensaje esperado', () => pm.expect(pm.response.json().error).to.eql("Campo desconocido: inyeccion"));
    language: text/javascript
order: 160000
